name: Sync upstream
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-upstream
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'robertofabiani2003-crypto/BormoStats'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh api --method POST "repos/$REPOSITORY/merge-upstream" -f branch=main
